name: Add to Knowledge Pool

# Новая issue этой области попадает на общую доску пула (проект №11)
# и сразу получает пометку area. Статус и итерацию ставит человек.

on:
  issues:
    types: [opened, reopened, transferred]

permissions:
  contents: read

jobs:
  add-to-pool:
    runs-on: ubuntu-latest
    steps:
      - name: Add issue to Knowledge Pool and tag area
        env:
          GH_TOKEN: ${{ secrets.POOL_PROJECT_TOKEN }}
          ISSUE_URL: ${{ github.event.issue.html_url }}
          OWNER: akopyan757
          PROJECT: "11"
          AREA: "Architecture"
        run: |
          set -euo pipefail

          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::warning::секрет POOL_PROJECT_TOKEN не задан — карточка на доску пула не добавлена"
            exit 0
          fi

          project_id=$(gh project view "$PROJECT" --owner "$OWNER" --format json --jq .id)
          item_id=$(gh project item-add "$PROJECT" --owner "$OWNER" --url "$ISSUE_URL" --format json --jq .id)

          fields=$(gh project field-list "$PROJECT" --owner "$OWNER" --format json)
          field_id=$(jq -r '.fields[] | select(.name=="area") | .id' <<<"$fields")
          option_id=$(jq -r --arg a "$AREA" '.fields[] | select(.name=="area") | .options[] | select(.name==$a) | .id' <<<"$fields")

          if [ -z "$option_id" ] || [ "$option_id" = "null" ]; then
            echo "::error::на доске нет варианта area=$AREA"
            exit 1
          fi

          gh project item-edit \
            --id "$item_id" \
            --project-id "$project_id" \
            --field-id "$field_id" \
            --single-select-option-id "$option_id"

          echo "$ISSUE_URL -> пул, area=$AREA"
